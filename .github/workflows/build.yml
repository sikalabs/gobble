name: "Try to build it"

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          args: build --snapshot --skip before

      - name: upload latest builds (on master)
        if: github.ref == 'refs/heads/master'
        env:
          SLR_SIKALABS_UPLOAD_BIN_ACCESS_KEY: ${{ secrets.SLR_SIKALABS_UPLOAD_BIN_ACCESS_KEY }}
          SLR_SIKALABS_UPLOAD_BIN_SECRET_KEY: ${{ secrets.SLR_SIKALABS_UPLOAD_BIN_SECRET_KEY }}
        run: |
          curl -O https://sikalabs.fra1.digitaloceanspaces.com/bin/upload-sikalabs-bin-linux-amd64
          chmod +x upload-sikalabs-bin-linux-amd64

          cp dist/gobble_linux_amd64_v1/gobble gobble
          cp dist/gobble_linux_amd64_v1/gobble gobble-linux-amd64
          ./upload-sikalabs-bin-linux-amd64 gobble
          ./upload-sikalabs-bin-linux-amd64 gobble-linux-amd64

          cp dist/gobble_darwin_arm64_v8.0/gobble gobble-darwin-arm64
          ./upload-sikalabs-bin-linux-amd64 gobble-darwin-arm64
